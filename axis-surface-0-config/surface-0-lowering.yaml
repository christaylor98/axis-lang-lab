version: "0.1"
target_ir: "0.2"

rules:
  lowering:
    Program:
      - op: iterate
        over: field:decls

    Function:
      - op: begin_function
        name: field:name

      - op: lower_children
        field: body

      - op: finalize_function

    Arg:
      - op: push_arg
        index: field:index

    Lit:
      - op: push_literal
        type: field:type
        value: field:value

    Call:
      - op: call_operator
        name: field:op
