# AI2 Lowering Specification
# Maps AI2 Schema AST nodes to Core IR terms
# Reuses expression lowering semantics

version: "0.1"
target_ir: "0.2"

rules:
  # Literals
  IntLit:
    target: CIntLit
    fields:
      value: token:value

  BoolLit:
    target: CBoolLit
    fields:
      value: token:value

  UnitLit:
    target: CUnitLit
    fields: {}

  # Variable reference
  VarRef:
    target: CVar
    fields:
      name: token:name

  # Let binding
  LetExpr:
    target: CLet
    fields:
      name: token:name
      value: node:value
      body: node:body

  # Lambda abstraction
  LamExpr:
    target: CLam
    fields:
      param: token:param
      body: node:body

  # Conditional
  IfExpr:
    target: CIf
    fields:
      condition: node:condition
      then_branch: node:then_branch
      else_branch: node:else_branch

  # Application
  AppExpr:
    target: CApp
    fields:
      parts: nodes:parts
