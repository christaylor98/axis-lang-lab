# Lowering Specification for lang-lab-poc-userfiles
# Wave S3: Updated to spec-driven format

version: "0.1"
target_ir: "0.2"

rules:
  # Literals
  IntLit:
    target: CIntLit
    fields:
      value: token:value

  BoolLit:
    target: CBoolLit
    fields:
      value: token:value

  StringLit:
    target: CStringLit
    fields:
      value: token:value

  UnitLit:
    target: CUnitLit
    fields: {}

  # Variable reference
  VarRef:
    target: CVar
    fields:
      name: token:name

  # Let binding
  LetExpr:
    target: CLet
    fields:
      name: token:name
      value: node:value
      body: node:body

  # Lambda abstraction
  LamExpr:
    target: CLam
    fields:
      param: token:param
      body: node:body

  # Application
  AppExpr:
    target: CApp
    fields:
      func: node:func
      arg: node:arg

  # If expression
  IfExpr:
    target: CIf
    fields:
      cond: node:cond
      then_branch: node:then_branch
      else_branch: node:else_branch
