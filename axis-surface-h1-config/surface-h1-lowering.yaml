lowering:
  Program:
    - op: iterate
      over: field:items

  Item:
    - op: lower_child
      field: variant

  FnDecl:
    - op: begin_function
      name: field:name
    - op: lower_children
      field: body
    - op: finalize_function

  Block:
    - op: lower_children
      field: content

  BlockContent:
    - op: iterate
      over: field:stmts

  Stmt:
    - op: lower_child
      field: variant

  LetStmt:
    - op: lower_child
      field: value
    - op: bind_local
      name: field:name

  ExprStmt:
    - op: lower_child
      field: expr

  IntentDirectiveStmt:
    - op: nop

  Expr:
    - op: lower_child
      field: variant

  IfExpr:
    - op: lower_child
      field: condition
    - op: lower_child
      field: then_block
    - op: lower_child
      field: else_block
    - op: call_operator
      name: if

  MatchExpr:
    - op: lower_child
      field: scrutinee
    - op: iterate
      over: field:arms
    - op: call_operator
      name: match

  MatchArm:
    - op: lower_child
      field: pattern
    - op: lower_child
      field: expr

  Pattern:
    - op: lower_child
      field: variant

  IdentPat:
    - op: push_literal
      type: pattern
      value: field:name

  CtorPat:
    - op: push_literal
      type: ctor
      value: field:name
    - op: lower_child
      field: patterns

  ForExpr:
    - op: lower_child
      field: iter
    - op: lower_child
      field: body
    - op: call_operator
      name: for

  LoopExpr:
    - op: lower_child
      field: body
    - op: call_operator
      name: loop

  SpawnExpr:
    - op: lower_child
      field: body
    - op: call_operator
      name: spawn

  JoinExpr:
    - op: lower_child
      field: handle
    - op: call_operator
      name: join

  ChannelExpr:
    - op: call_operator
      name: channel

  SendExpr:
    - op: lower_child
      field: channel
    - op: lower_child
      field: value
    - op: call_operator
      name: send

  RecvExpr:
    - op: lower_child
      field: channel
    - op: call_operator
      name: recv

  EqualityExpr:
    - op: lower_child
      field: left
    - op: iterate
      over: field:ops

  EqualityOp:
    - op: lower_child
      field: right
    - op: call_operator
      name: field:operator

  RelExpr:
    - op: lower_child
      field: left
    - op: iterate
      over: field:ops

  RelOp:
    - op: lower_child
      field: right
    - op: call_operator
      name: field:operator

  AddExpr:
    - op: lower_child
      field: left
    - op: iterate
      over: field:ops

  AddOp:
    - op: lower_child
      field: right
    - op: call_operator
      name: field:operator

  MulExpr:
    - op: lower_child
      field: left
    - op: iterate
      over: field:ops

  MulOp:
    - op: lower_child
      field: right
    - op: call_operator
      name: field:operator

  UnaryExpr:
    - op: lower_child
      field: variant

  CallExpr:
    - op: lower_child
      field: target
    - op: iterate
      over: field:suffixes

  CallSuffix:
    - op: lower_child
      field: args
    - op: call_operator
      name: call

  Primary:
    - op: lower_child
      field: variant

  Literal:
    - op: push_literal
      type: auto
      value: field:value

  ControllerDecl:
    - op: begin_controller
      name: field:name
    - op: iterate
      over: field:members
    - op: finalize_controller

  ControllerMember:
    - op: lower_child
      field: handler
    - op: bind_event
      event: field:event

  RunStmt:
    - op: run_controller
      name: field:controller

  Empty:
    - op: nop

  ParamList:
    - op: iterate
      over: field:params

  Param:
    - op: declare_param
      name: field:name

  ArgList:
    - op: iterate
      over: field:args
