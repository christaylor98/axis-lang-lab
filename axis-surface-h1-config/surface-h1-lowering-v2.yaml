# Axis Surface H1 Lowering Specification v0.1
# Maps H1 Schema AST nodes to Core IR 0.2 terms
#
# HARD CONSTRAINTS:
# - Reuses Surface-0 lowering semantics
# - H1 is syntax + intent only
# - Only Core IR 0.2 constructs supported (no loops, match, controllers)
# - Intent directives are ignored (metadata only)
#
# IMPLEMENTATION STATUS:
# - v0.1 supports ONLY the Core IR 0.2 subset
# - Loops, match, controllers, concurrency: NOT IMPLEMENTED
# - Programs using unsupported constructs will fail lowering

version: "0.1"
target_ir: "0.2"

rules:
  # Function declaration (no direct Core IR equivalent - becomes lambda)
  # For now, treat as error - functions need special handling
  FnDecl:
    target: CLam
    fields:
      param: token:name  # This is wrong but placeholder
      body: node:body

  # Literals
  Literal:
    target: CIntLit
    fields:
      value: token:value

  # Primary (just passes through to actual expression)
  Primary:
    target: CIntLit
    fields:
      value: token:value

  # Variable reference
  VarRef:
    target: CVar
    fields:
      name: token:name

  # Let binding
  LetStmt:
    target: CLet
    fields:
      name: token:name
      value: node:value
      body: node:body  # This is wrong - LetStmt doesn't have body in H1

  # Conditional
  IfExpr:
    target: CIf
    fields:
      cond: node:condition
      then_branch: node:then_block
      else_branch: node:else_block

  # Call expression
  CallExpr:
    target: CApp
    fields:
      parts: nodes:suffixes  # This is wrong structure

  # Block (sequence - not directly in Core IR)
  # Treat as passthrough for now
  Block:
    target: CUnitLit
    fields: {}

  # Expression statement
  ExprStmt:
    target: CUnitLit
    fields: {}

  # Intent directive - no-op
  IntentDirectiveStmt:
    target: CUnitLit
    fields: {}

