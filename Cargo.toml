[package]
name = "axis-lang-lab"
version = "0.1.0"
edition = "2021"
authors = ["christaylor98"]
description = "Spec-driven compiler that lowers source code into Axis Core IR — a closed, canonical intermediate representation."

[[bin]]
name = "axis"
path = "src/main.rs"

[[bin]]
name = "seal"
path = "src/bin/seal.rs"

[features]
# Legacy lexer from Phase 1 - DO NOT USE in new code
# This feature exists only for backward compatibility and will be removed
legacy-lexer = []

# Wave C: Sealed mode - embeds all specs at compile time for deterministic builds
sealed = []

# Gate for bridge implementation examples (require axis_rust_bridge crate)
rust-bridge = []

[[example]]
name = "libaxis_example"
required-features = ["rust-bridge"]

[dependencies]
capnp = "0.18"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
sha2 = "0.10"
chrono = "0.4"

[build-dependencies]
capnpc = "0.18"

[dev-dependencies]
tempfile = "3.0"
